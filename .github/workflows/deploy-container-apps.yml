name: "Build & Deploy Container Apps"

# Builds the Docker image, pushes to ACR, and updates both Container Apps.
# Runs on push to master when application code changes.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "function_app.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy-container-apps.yml"

  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME:        acrdevpilotdev4056
  ACR_LOGIN_SERVER: acrdevpilotdev4056.azurecr.io
  IMAGE_NAME:      devpilot
  RESOURCE_GROUP:  rg-devpilot-compute-dev
  WEBHOOK_APP:     ca-webhook-dev-pbrv5
  WORKER_APP:      ca-workers-dev-pbrv5

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Build & push image to ACR ──────────────────────────────────────
      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"

          # Login to ACR using Azure CLI token (works without admin credentials)
          az acr login --name ${{ env.ACR_NAME }}

          # Build with standard docker buildx (ACR Tasks blocked on Free Trial)
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "✅ Image pushed: $IMAGE_TAG"

      # ── Update webhook Container App ────────────────────────────────────
      - name: Update webhook Container App
        run: |
          az containerapp update \
            --name ${{ env.WEBHOOK_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_TAG }} \
            --set-env-vars "IMAGE_TAG=${{ github.sha }}"
          echo "✅ Webhook app updated"

      # ── Update workers Container App ────────────────────────────────────
      - name: Update workers Container App
        run: |
          az containerapp update \
            --name ${{ env.WORKER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_TAG }} \
            --set-env-vars "IMAGE_TAG=${{ github.sha }}"
          echo "✅ Worker app updated"

      # ── Verify health endpoint ──────────────────────────────────────────
      - name: Verify webhook health
        run: |
          echo "Waiting 30s for deployment to stabilize..."
          sleep 30
          FQDN=$(az containerapp show \
            --name ${{ env.WEBHOOK_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Checking health: https://$FQDN/health"
          curl -sf "https://$FQDN/health" | jq .
          echo "✅ Webhook is live"

      - name: Deployment summary
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.WEBHOOK_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Webhook URL | https://$FQDN/devpilot/webhook |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | https://$FQDN/health |" >> $GITHUB_STEP_SUMMARY

name: "Deploy Function App"

# Deploys Python Azure Functions code on push to master when src/ changes.
# Also runs after terraform-apply succeeds (function app must exist first).

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "function_app.py"
      - "host.json"
      - "requirements.txt"
      - ".github/workflows/deploy-functions.yml"

  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FUNCTION_APP_NAME: ${{ secrets.FUNCTION_APP_NAME }}

jobs:
  deploy:
    name: Deploy Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name:    ${{ env.FUNCTION_APP_NAME }}
          package:     "."
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Verify deployment
        run: |
          echo "✅ Deployment complete"
          az functionapp show \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --resource-group rg-devpilot-compute-dev \
            --query "{name:name, state:state, defaultHostName:defaultHostName}" \
            -o table
